# Spark defaults for a multi-machine LAN / air-gapped cluster (docker run with
# --network host). Mounted read-only as $SPARK_HOME/conf/spark-defaults.conf in
# the master and every worker container.
#
# Without these, the driver and the block managers listen on random ports
# (e.g. 44681), which a firewall rule cannot cover: executors on other
# machines then cannot connect back and tasks hang. Fixed ports keep all
# traffic inside the 30000-40000 range opened on every node.
# spark.port.maxRetries lets several executors on one machine take the next
# free port (35100, 35101, ...).
spark.driver.port          35000
spark.blockManager.port    35100
spark.port.maxRetries      32
