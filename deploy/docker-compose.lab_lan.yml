# =============================================================================
# LAB ONLY - 2-machine NER cluster (cluster / in-process mode) on the lab LAN.
# Separate from the air-gapped Ada setup: own project name (lab-lan), own
# container names (lab-*), no shared volumes, airgap files untouched.
#
#   lab master machine 192.168.4.104 : lab-master (Spark master + driver) + lab-worker
#   lab remote machine 192.168.4.101 : lab-worker
#
# Host networking, so this needs Docker CE inside WSL2 Ubuntu with mirrored
# networking on BOTH machines - NOT Docker Desktop (its containers cannot bind
# the real LAN IP; see docs/WINDOWS_LAN_NETWORKING_FIX_20260921.md). Firewall,
# Private network and WSL keep-alive: docs/NER_CLUSTER_FROM_DEPS_IMAGE_WSL_20261005.md
# section 10.2, plus TCP 35200 is covered by the existing 30000-40000 rule.
#
# Every node needs the same repo copy (data/, models/, inference/, this file)
# and the model weights folder at MODEL_FS_DIR.
#
# Run everything from the repo root, in the Ubuntu shell.
#
# --- Test 1: CPU only, the real air-gapped image (ner-translate-worker:latest)
#   master machine:
#     docker compose -f deploy/docker-compose.lab_lan.yml --env-file deploy/lab_lan.env \
#       --profile master --profile worker up -d
#   remote machine (192.168.4.101):
#     LAB_NODE_IP=192.168.4.101 docker compose -f deploy/docker-compose.lab_lan.yml \
#       --env-file deploy/lab_lan.env --profile worker up -d
#
# --- Test 2: GPU, lab-only cu128 image (build deploy/Dockerfile.lab_cu128 on both nodes first)
#   same two commands with  -f deploy/docker-compose.lab_lan.gpu.yml  added after the first -f
#
# --- Check (from the REMOTE machine, so the firewall is exercised):
#     curl -s http://192.168.4.104:8080/json/        # aliveworkers: 2
#
# --- Submit (master machine):
#     docker exec lab-master python submit_pipeline_job.py --pipeline ner_translate \
#       --input /app/data/ner_samples --execution-mode cluster \
#       --master spark://192.168.4.104:7077 --partitions 2 \
#       --driver-memory 2g --executor-memory 4g
#
# --- Stop: same command as start, with  down  instead of  up -d  (remote first).
# =============================================================================
name: lab-lan

x-lab-volumes: &lab-volumes
  - ../results:/app/results
  - ../data:/app/data
  - ../models:/app/models
  - ../inference:/app/inference
  - ../submit_pipeline_job.py:/app/submit_pipeline_job.py
  - ./spark-defaults.lan.conf:/opt/spark/conf/spark-defaults.conf:ro   # driver 35000, block managers 35100+
  - ${MODEL_FS_DIR:?set MODEL_FS_DIR in deploy/lab_lan.env}:/mnt/models:ro

x-lab-env: &lab-env
  MODEL_STORE_URI: ${MODEL_STORE_URI:-file:///mnt/models}
  MODEL_CACHE_DIR: /model_cache
  SPARK_DAEMON_MEMORY: 256m
  PYTHONUNBUFFERED: "1"
  SPARK_LOCAL_IP: ${LAB_NODE_IP:?set LAB_NODE_IP to this machine's LAN IP}
  SPARK_LOCAL_HOSTNAME: ${LAB_NODE_IP}
  SPARK_WORKER_PORT: "35200"     # fixed, inside the opened 30000-40000 range (default is random)
  # Empty = no CUDA device visible: a CPU run cannot pick up the GPU by
  # accident. docker-compose.lab_lan.gpu.yml sets it to 0.
  CUDA_VISIBLE_DEVICES: ""

services:
  lab-master:                    # Spark master; the driver runs here too (docker exec)
    profiles: [master]
    image: ${LAB_IMAGE:-ner-translate-worker:latest}
    container_name: lab-master
    network_mode: host
    init: true
    working_dir: /app
    environment: *lab-env
    volumes: *lab-volumes
    command: bash -c "$$SPARK_HOME/sbin/start-master.sh -h $$SPARK_LOCAL_IP && tail -f $$SPARK_HOME/logs/*master*"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://$${SPARK_LOCAL_IP}:8080 >/dev/null"]
      interval: 5s
      retries: 30

  lab-worker:                    # one per machine; executors load GLiNER + NLLB in-process
    profiles: [worker]
    image: ${LAB_IMAGE:-ner-translate-worker:latest}
    container_name: lab-worker
    network_mode: host
    init: true
    working_dir: /app
    environment: *lab-env
    volumes: *lab-volumes
    # -c must stay >= 4 (each executor asks for 4 cores)
    command: bash -c "$$SPARK_HOME/sbin/start-worker.sh spark://${LAB_MASTER_IP:?set LAB_MASTER_IP}:7077 -c ${LAB_WORKER_CORES:-4} -m ${LAB_WORKER_MEMORY:-6g} && tail -f $$SPARK_HOME/logs/*worker*"
