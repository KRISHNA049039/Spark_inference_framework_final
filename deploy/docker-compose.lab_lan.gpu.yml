# =============================================================================
# LAB ONLY - GPU add-on for docker-compose.lab_lan.yml (NOT an Ada check: it
# swaps in the lab cu128 images from deploy/Dockerfile.lab_cu128, so it only
# validates the GPU code path on the lab's sm_120 cards).
#
#   docker compose -f deploy/docker-compose.lab_lan.yml -f deploy/docker-compose.lab_lan.gpu.yml \
#     --env-file deploy/lab_lan.env --profile cluster-master --profile cluster-worker up -d
#   LAB_GPU=1 bash deploy/lab_lan_tests.sh ...      # the test runner adds this file itself
# =============================================================================
x-gpu: &gpu
  resources:
    reservations:
      devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

services:
  lab-cluster-master:            # driver must match the executors' package versions
    image: ${LAB_MMI_GPU_IMAGE:-multi-model-inference:lab-cu128}

  lab-cluster-worker:
    image: ${LAB_MMI_GPU_IMAGE:-multi-model-inference:lab-cu128}
    environment:
      CUDA_VISIBLE_DEVICES: "0"
    deploy: *gpu

  lab-kitchen:
    image: ${LAB_SERVER_GPU_IMAGE:-ner-translate-server:lab-cu128}
    environment:
      CUDA_VISIBLE_DEVICES: "0"
    deploy: *gpu
